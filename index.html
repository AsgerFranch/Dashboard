<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Dashboard</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #ffffff; /* Renere hvid baggrund som referencen */
            color: #1e293b;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Loading Spinner */
        .loader {
            border: 3px solid #f1f5f9;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Checkbox styling */
        input[type="checkbox"] { accent-color: #3b82f6; }
        
        /* Sidebar transition for mobile */
        .sidebar-transition { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        
        /* Abstract icon overlays for reference match */
        .icon-overlay-wave {
            position: absolute;
            width: 150%;
            height: 150%;
            background: rgba(255,255,255,0.15);
            border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
            top: -20%;
            left: -20%;
            pointer-events: none;
        }
        .icon-overlay-circle {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(0,0,0,0.1) 0%, rgba(255,255,255,0.1) 100%);
            border-radius: inherit;
            pointer-events: none;
        }
    </style>
</head>
<body class="h-screen w-full antialiased flex overflow-hidden bg-white">

    <!-- INITIAL LOADING SCREEN -->
    <div id="loadingScreen" class="absolute inset-0 bg-white z-[100] flex flex-col items-center justify-center transition-opacity duration-300">
        <div class="loader mb-4"></div>
        <p class="text-slate-500 font-medium text-sm animate-pulse">Forbinder til databasen...</p>
    </div>

    <!-- AUTHENTICATION VIEW -->
    <div id="authView" class="fixed inset-0 w-full h-full bg-slate-50 z-[60] hidden flex-col items-center justify-center p-4">
        <div class="bg-white p-6 sm:p-8 rounded-3xl shadow-xl border border-slate-100 w-full max-w-md">
            <div class="text-center mb-8">
                <div class="w-14 h-14 bg-blue-600 rounded-2xl mx-auto flex items-center justify-center mb-5 shadow-lg shadow-blue-600/30">
                    <i class="fas fa-fingerprint text-white text-2xl"></i>
                </div>
                <h1 class="text-2xl font-bold tracking-tight text-slate-800" id="authTitle">Velkommen</h1>
                <p class="text-sm text-slate-500 mt-2" id="authSubtitle">Log ind for at synkronisere dit dashboard</p>
            </div>

            <form id="authForm" class="space-y-4">
                <div id="authErrorMsg" class="hidden bg-red-50 text-red-600 text-sm p-3 rounded-xl border border-red-100 text-center"></div>
                
                <div id="emailInputGroup">
                    <label class="block text-sm font-medium text-slate-700 mb-1.5">Email</label>
                    <input type="email" id="authEmail" class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-blue-600/20 focus:border-blue-600 outline-none transition-all text-sm">
                </div>
                <div id="passwordInputGroup">
                    <label class="block text-sm font-medium text-slate-700 mb-1.5">Adgangskode</label>
                    <input type="password" id="authPassword" class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-blue-600/20 focus:border-blue-600 outline-none transition-all text-sm">
                </div>
                
                <button type="submit" id="authSubmitBtn" class="w-full py-3.5 rounded-xl bg-slate-900 text-white font-medium hover:bg-slate-800 transition-colors shadow-md mt-4">
                    <span>Log ind</span>
                </button>
            </form>
            
            <div class="mt-6 flex flex-col gap-3">
                <button type="button" id="toggleAuthModeBtn" class="text-sm text-blue-600 hover:text-blue-700 font-medium transition-colors mt-2 text-center w-full">
                    Har du ikke en konto? Opret en.
                </button>
            </div>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="dashboardView" class="flex-1 flex w-full h-full relative hidden">
        
        <!-- Center Content -->
        <main class="flex-1 overflow-y-auto flex flex-col py-6 px-4 sm:py-10 sm:px-8 lg:px-12 relative w-full transition-all">
            
            <!-- Header -->
            <header class="flex flex-col sm:flex-row sm:justify-between sm:items-end mb-8 gap-4 pb-4 border-b border-slate-100">
                <div>
                    <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-slate-900">Oversigt</h1>
                    <p class="text-sm text-slate-500 mt-1 flex items-center gap-2">
                        <span id="syncStatus" class="w-2 h-2 rounded-full bg-green-500 animate-pulse shadow-[0_0_8px_rgba(34,197,94,0.6)]"></span> 
                        <span id="userStatusText">Database synkroniseret</span>
                    </p>
                </div>
                
                <div class="flex flex-wrap gap-2 sm:gap-3">
                    <button id="addAppBtnHeader" class="px-4 py-2 sm:px-5 sm:py-2.5 rounded-xl bg-blue-600 text-white font-medium text-xs sm:text-sm hover:bg-blue-700 transition-colors shadow-sm shadow-blue-600/20 flex items-center gap-2 hidden">
                        <i class="fas fa-plus"></i> <span class="hidden sm:inline">Tilføj Ement</span>
                    </button>
                    <button id="toggleEditBtn" class="px-4 py-2 sm:px-5 sm:py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-slate-700 font-medium text-xs sm:text-sm hover:bg-slate-100 transition-colors flex items-center gap-2">
                        <i class="fas fa-pen"></i> <span class="hidden sm:inline">Rediger</span>
                    </button>
                    <!-- Mobile To-Do Toggle -->
                    <button id="mobileTodoBtn" class="lg:hidden px-4 py-2 rounded-xl bg-slate-50 border border-slate-200 text-slate-700 hover:bg-slate-100 transition-colors flex items-center gap-2">
                        <i class="fas fa-check-square"></i>
                    </button>
                    <button id="logoutBtn" class="px-4 py-2 rounded-xl bg-slate-50 border border-slate-200 text-slate-600 hover:bg-slate-100 transition-colors flex items-center gap-2" title="Log ud">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
            </header>

            <!-- App List (Opdateret til at matche referencen) -->
            <div id="appGrid" class="grid grid-cols-1 lg:grid-cols-2 2xl:grid-cols-3 gap-y-2 gap-x-6 pb-20">
                <!-- Dynamisk indhold -->
            </div>
        </main>

        <!-- Resizer (Desktop only) -->
        <div id="sidebarResizer" class="hidden lg:block w-1 bg-transparent hover:bg-slate-200 cursor-col-resize transition-colors z-40 relative"></div>

        <!-- Mobile Overlay -->
        <div id="sidebarOverlay" class="fixed inset-0 bg-slate-900/20 backdrop-blur-sm z-40 lg:hidden opacity-0 pointer-events-none transition-opacity duration-300"></div>

        <!-- TO-DO SIDEBAR -->
        <aside id="todoSidebar" class="fixed lg:relative top-0 right-0 h-full w-4/5 max-w-sm lg:w-[320px] bg-slate-50/50 z-50 lg:z-30 shadow-2xl lg:shadow-none border-l border-slate-100 flex flex-col sidebar-transition translate-x-full lg:translate-x-0">
            <div class="px-5 py-5 border-b border-slate-100 flex justify-between items-center bg-white">
                <h2 class="text-sm font-bold text-slate-800 uppercase tracking-wider flex items-center gap-2">
                    <i class="fas fa-check-circle text-blue-600"></i> Synkroniseret To-Do
                </h2>
                <button id="closeSidebarBtn" class="lg:hidden w-8 h-8 flex items-center justify-center rounded-full bg-slate-100 text-slate-500 hover:text-slate-800">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="flex-1 overflow-y-auto p-4 flex flex-col">
                <div id="todoList" class="space-y-2 flex-1">
                    <!-- To-Do Items genereres her -->
                </div>
                
                <div class="mt-4 pt-4 border-t border-slate-200">
                    <div class="flex items-center bg-white rounded-xl px-4 py-3 border border-slate-200 focus-within:border-blue-500 focus-within:ring-2 focus-within:ring-blue-500/20 shadow-sm transition-all">
                        <i class="fas fa-plus text-slate-400 text-sm mr-3"></i>
                        <input type="text" id="newTaskInput" class="bg-transparent outline-none text-sm text-slate-700 w-full placeholder-slate-400" placeholder="Tilføj en opgave...">
                    </div>
                </div>
            </div>
        </aside>
    </div>

    <!-- ADD/EDIT APP MODAL -->
    <div id="appModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300 flex items-center justify-center z-[80] p-4">
        <div class="bg-white rounded-[2rem] w-full max-w-md shadow-2xl overflow-hidden transform scale-95 transition-transform duration-300" id="appModalContent">
            <div class="px-6 py-5 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                <h3 class="text-lg font-bold text-slate-800" id="modalTitle">Tilføj Element</h3>
                <button id="closeAppModalBtn" class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 hover:bg-slate-200 transition-colors">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <form id="appForm" class="p-6 space-y-4">
                <input type="hidden" id="appId">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1.5">Titel</label>
                    <input type="text" id="appName" required placeholder="f.eks. Stocks" class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-blue-600/20 focus:border-blue-600 outline-none transition-all text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1.5">Beskrivelse (Undertekst)</label>
                    <input type="text" id="appDescription" required placeholder="f.eks. Shares of public companies" class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-blue-600/20 focus:border-blue-600 outline-none transition-all text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1.5">Handling (URL)</label>
                    <input type="text" id="appUrl" required placeholder="https://..." class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-blue-600/20 focus:border-blue-600 outline-none transition-all text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1.5 flex justify-between">
                        <span>Ikon (FontAwesome klasse)</span>
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i id="iconPreview" class="fas fa-chart-line text-slate-400 text-lg"></i>
                        </div>
                        <input type="text" id="appIcon" placeholder="fas fa-chart-line" class="w-full pl-12 pr-4 py-3 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-blue-600/20 focus:border-blue-600 outline-none transition-all text-sm">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1.5">Billede (Valgfrit - erstatter farvet ikon)</label>
                    <input type="file" id="appImageFile" accept="image/*" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white outline-none transition-all text-sm file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer">
                    <div id="currentImagePreview" class="mt-3 hidden">
                        <p class="text-xs font-medium text-slate-600 mb-1">Nuværende billede:</p>
                        <div class="relative inline-block">
                            <img id="currentImageImg" src="" class="h-16 w-16 rounded-xl border border-slate-200 object-cover shadow-sm">
                            <button type="button" id="removeImageBtn" class="absolute -top-2 -right-2 w-6 h-6 bg-red-500 text-white rounded-full flex items-center justify-center shadow hover:bg-red-600 transition-colors" title="Fjern billede">
                                <i class="fas fa-times text-xs"></i>
                            </button>
                        </div>
                    </div>
                    <input type="hidden" id="existingImageUrl">
                </div>
                <div class="flex justify-end gap-3 pt-4">
                    <button type="button" id="cancelAppBtn" class="px-5 py-2.5 rounded-xl bg-slate-100 text-slate-700 font-medium text-sm hover:bg-slate-200 transition-colors">Annuller</button>
                    <button type="submit" class="px-5 py-2.5 rounded-xl bg-blue-600 text-white font-medium text-sm hover:bg-blue-700 transition-colors shadow-sm">Gem</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCqEJ5yRtTB1KjAG0RmnEsDNiXFJBKwUxo",
            authDomain: "tempco2fugt.firebaseapp.com",
            databaseURL: "https://tempco2fugt-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "tempco2fugt",
            storageBucket: "tempco2fugt.firebasestorage.app",
            messagingSenderId: "1068932962336",
            appId: "1:1068932962336:web:36d844285dfa652d5a4445"
        };

        const app = initializeApp(firebaseConfig, "DashboardApp");
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);

        // State
        let apps = [];
        let todos = []; 
        let isEditMode = false;
        let currentUser = null;
        let firestoreUnsubscribe = null;
        let isLoginMode = true;

        // Theme colors til at matche referencen
        const themes = [
            { bg: '#237bd1', iconColor: 'text-white' }, // Blue (Stocks)
            { bg: '#5a4970', iconColor: 'text-white' }, // Purple (Mutual funds)
            { bg: '#d49b8a', iconColor: 'text-white' }, // Peach (Currency)
            { bg: '#954c6c', iconColor: 'text-white' }, // Maroon (Bonds)
            { bg: '#2b9d62', iconColor: 'text-white' }  // Green (Backup)
        ];

        // Standard apps opdateret til at matche referencebilledets data!
        const defaultApps = [
            { id: '1', title: 'Stocks', description: 'Shares of public companies', url: '#', icon: 'fas fa-chart-line', imageUrl: '' },
            { id: '2', title: 'Mutual funds', description: 'Ready-made portfolios at affordable prices', url: '#', icon: 'fas fa-chart-pie', imageUrl: '' },
            { id: '3', title: 'Currency', description: 'Currency trading at the exchange rate', url: '#', icon: 'fas fa-coins', imageUrl: '' },
            { id: '4', title: 'Bonds', description: 'Lend your funds to companies', url: '#', icon: 'fas fa-file-invoice-dollar', imageUrl: '' }
        ];

        const defaultTodos = [
            { text: "Tjek markedets åbningstider", completed: false },
            { text: "Gennemgå porteføljeudbytte", completed: false }
        ];

        // DOM
        const authView = document.getElementById('authView');
        const dashboardView = document.getElementById('dashboardView');
        const loadingScreen = document.getElementById('loadingScreen');
        const appGrid = document.getElementById('appGrid');
        
        // Auth Listeners
        onAuthStateChanged(auth, (user) => {
            loadingScreen.classList.add('opacity-0', 'pointer-events-none');
            setTimeout(() => loadingScreen.style.display = 'none', 300);

            if (user) {
                currentUser = user;
                authView.classList.add('hidden');
                authView.classList.remove('flex');
                dashboardView.classList.remove('hidden');
                
                document.getElementById('userStatusText').innerText = "Synkroniseret med database";
                document.getElementById('syncStatus').className = "w-2 h-2 rounded-full bg-green-500 animate-pulse shadow-[0_0_8px_rgba(34,197,94,0.6)]";
                
                startSync(user.uid);
            } else {
                currentUser = null;
                authView.classList.remove('hidden');
                authView.classList.add('flex');
                dashboardView.classList.add('hidden');
                if (firestoreUnsubscribe) firestoreUnsubscribe();
            }
        });

        document.getElementById('authForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('authEmail').value;
            const password = document.getElementById('authPassword').value;
            const btnSpan = document.querySelector('#authSubmitBtn span');
            
            if(!email || !password) return;

            btnSpan.innerText = "Vent venligst...";
            try {
                if (isLoginMode) await signInWithEmailAndPassword(auth, email, password);
                else await createUserWithEmailAndPassword(auth, email, password);
            } catch (error) {
                document.getElementById('authErrorMsg').innerText = "Fejl: Tjek dine oplysninger.";
                document.getElementById('authErrorMsg').classList.remove('hidden');
            } finally {
                btnSpan.innerText = isLoginMode ? "Log ind" : "Opret bruger";
            }
        });

        document.getElementById('toggleAuthModeBtn').addEventListener('click', () => {
            isLoginMode = !isLoginMode;
            document.getElementById('authTitle').innerText = isLoginMode ? "Velkommen" : "Opret Konto";
            document.querySelector('#authSubmitBtn span').innerText = isLoginMode ? "Log ind" : "Opret bruger";
            document.getElementById('toggleAuthModeBtn').innerText = isLoginMode ? "Har du ikke en konto? Opret en." : "Har du allerede en konto? Log ind.";
        });

        document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));

        // Firestore Sync - Begge lister synkroniseres her!
        function startSync(uid) {
            const userDocRef = doc(db, 'users', uid);
            firestoreUnsubscribe = onSnapshot(userDocRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    apps = data.apps || [];
                    todos = data.todos || [];
                    
                    // Fallback for eksisterende data uden de nye felter
                    if (!data.todos && data.apps) {
                        todos = [...defaultTodos];
                        saveTodosToFirestore();
                    }
                } else {
                    apps = [...defaultApps];
                    todos = [...defaultTodos];
                    saveAppsToFirestore();
                    saveTodosToFirestore();
                }
                renderApps();
                renderTodos();
            }, (error) => {
                console.error("Kunne ikke lytte til database.", error);
            });
        }

        async function saveAppsToFirestore() {
            if (!currentUser) return;
            try { await setDoc(doc(db, 'users', currentUser.uid), { apps }, { merge: true }); } 
            catch (error) { console.error(error); }
        }

        // To-Do specifik gemmefunktion for synkronisering
        async function saveTodosToFirestore() {
            if (!currentUser) return;
            try { await setDoc(doc(db, 'users', currentUser.uid), { todos }, { merge: true }); } 
            catch (error) { console.error(error); }
        }

        function renderApps() {
            appGrid.innerHTML = '';
            
            apps.forEach((app, index) => {
                const card = document.createElement('div');
                const hasImage = app.imageUrl && app.imageUrl.trim() !== '';
                const theme = themes[index % themes.length];
                
                // Opdateret design: Ren liste (flex-row), matchende referencen
                card.className = `group relative flex items-center p-3 rounded-2xl transition-colors duration-200 ${isEditMode ? 'bg-slate-50' : 'hover:bg-slate-50 cursor-pointer'}`;
                
                let iconHtml = '';
                if (hasImage) {
                    iconHtml = `<img src="${app.imageUrl}" class="absolute inset-0 w-full h-full object-cover z-10">`;
                } else {
                    // Generer det flotte "squircle" reference ikon
                    iconHtml = `
                        <div class="icon-overlay-circle"></div>
                        <div class="icon-overlay-wave"></div>
                        <i class="${app.icon || 'fas fa-chart-line'} ${theme.iconColor} text-2xl relative z-10"></i>
                    `;
                }

                card.innerHTML = `
                    <div class="flex-shrink-0 w-[60px] h-[60px] rounded-[1.1rem] overflow-hidden relative mr-4 flex items-center justify-center shadow-sm" style="background-color: ${hasImage ? '#f8fafc' : theme.bg};">
                        ${iconHtml}
                    </div>
                    
                    <div class="flex-1 min-w-0 flex flex-col justify-center ${isEditMode ? 'pr-20' : 'pr-2'}">
                        <h3 class="font-[600] text-[17px] text-[#1a1a1a] mb-0.5 truncate tracking-tight">${app.title}</h3>
                        <p class="text-[14.5px] text-[#5e5e5e] truncate">${app.description || app.url || 'Ingen beskrivelse'}</p>
                    </div>
                `;

                if (!isEditMode) {
                    card.onclick = () => { if(app.url && app.url !== '#') window.open(app.url, '_blank'); };
                } else {
                    const controls = document.createElement('div');
                    controls.className = 'absolute right-3 top-1/2 transform -translate-y-1/2 flex gap-2 z-20';
                    controls.innerHTML = `
                        <button class="w-8 h-8 rounded-full bg-white border border-slate-200 text-slate-700 hover:bg-slate-100 flex items-center justify-center shadow-sm transition-colors" onclick="event.stopPropagation(); window.openEditModal('${app.id}')">
                            <i class="fas fa-pen text-xs"></i>
                        </button>
                        <button class="w-8 h-8 rounded-full bg-red-50 border border-red-100 text-red-600 hover:bg-red-100 flex items-center justify-center shadow-sm transition-colors" onclick="event.stopPropagation(); window.deleteApp('${app.id}')">
                            <i class="fas fa-trash text-xs"></i>
                        </button>
                    `;
                    card.appendChild(controls);
                }

                appGrid.appendChild(card);
            });

            if (isEditMode) {
                const addCard = document.createElement('div');
                addCard.className = 'relative flex items-center p-3 rounded-2xl transition-colors duration-200 hover:bg-blue-50/50 cursor-pointer border-2 border-dashed border-slate-200 mt-2';
                addCard.onclick = () => openAppModal();
                addCard.innerHTML = `
                    <div class="flex-shrink-0 w-[60px] h-[60px] rounded-[1.1rem] bg-slate-50 border border-slate-200 flex items-center justify-center mr-4 text-slate-400">
                        <i class="fas fa-plus text-xl"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <h3 class="text-[16px] font-[500] text-slate-700">Tilføj nyt element</h3>
                    </div>
                `;
                appGrid.appendChild(addCard);
            }
        }

        const todoList = document.getElementById('todoList');
        const newTaskInput = document.getElementById('newTaskInput');
        
        function renderTodos() {
            todoList.innerHTML = '';
            todos.forEach((todo, index) => {
                const div = document.createElement('div');
                div.className = 'group flex items-start p-3 bg-white border border-slate-100 hover:border-blue-100/50 rounded-xl transition-all relative';
                div.innerHTML = `
                    <div class="pt-0.5">
                        <input type="checkbox" ${todo.completed ? 'checked' : ''} 
                            class="w-4 h-4 rounded border-slate-300 cursor-pointer mr-3 mt-0.5" 
                            onchange="window.toggleTodo(${index})">
                    </div>
                    <span class="flex-1 text-[14.5px] outline-none min-h-[20px] ${todo.completed ? 'line-through text-slate-400' : 'text-slate-700'}" 
                          contenteditable="true" 
                          onblur="window.updateTodo(${index}, this.innerText)"
                          onkeydown="if(event.key === 'Enter'){ event.preventDefault(); this.blur(); }">${todo.text}</span>
                    <button class="opacity-0 group-hover:opacity-100 text-slate-300 hover:text-red-500 transition-opacity p-1 ml-2" 
                            onclick="window.deleteTodo(${index})">
                        <i class="fas fa-trash-alt text-xs"></i>
                    </button>
                `;
                todoList.appendChild(div);
            });
        }

        // Disse funktioner kalder saveTodosToFirestore hver gang der sker en ændring
        window.toggleTodo = (index) => { 
            todos[index].completed = !todos[index].completed; 
            saveTodosToFirestore(); 
        };
        
        window.updateTodo = (index, text) => { 
            if (text.trim() === '') {
                window.deleteTodo(index); 
            } else { 
                todos[index].text = text; 
                saveTodosToFirestore(); 
            } 
        };
        
        window.deleteTodo = (index) => { 
            todos.splice(index, 1); 
            saveTodosToFirestore(); 
        };

        newTaskInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && e.target.value.trim() !== '') {
                todos.push({ text: e.target.value.trim(), completed: false });
                e.target.value = '';
                saveTodosToFirestore();
            }
        });

        const appModal = document.getElementById('appModal');
        const appModalContent = document.getElementById('appModalContent');
        const appFormDom = document.getElementById('appForm');
        
        window.openAppModal = openAppModal;
        window.openEditModal = (id) => {
            const app = apps.find(a => a.id === id);
            if(app) openAppModal(app);
        };

        function openAppModal(app = null) {
            const currentImagePreview = document.getElementById('currentImagePreview');
            const currentImageImg = document.getElementById('currentImageImg');
            const existingImageUrl = document.getElementById('existingImageUrl');
            const appImageFile = document.getElementById('appImageFile');
            
            appImageFile.value = ''; 

            if (app) {
                document.getElementById('modalTitle').textContent = 'Rediger Element';
                document.getElementById('appId').value = app.id;
                document.getElementById('appName').value = app.title;
                document.getElementById('appDescription').value = app.description || '';
                document.getElementById('appUrl').value = app.url;
                document.getElementById('appIcon').value = app.icon || '';
                document.getElementById('iconPreview').className = app.icon || 'fas fa-chart-line';
                
                if (app.imageUrl) {
                    existingImageUrl.value = app.imageUrl;
                    currentImageImg.src = app.imageUrl;
                    currentImagePreview.classList.remove('hidden');
                } else {
                    existingImageUrl.value = '';
                    currentImagePreview.classList.add('hidden');
                }
            } else {
                document.getElementById('modalTitle').textContent = 'Tilføj Nyt Element';
                appFormDom.reset();
                document.getElementById('appId').value = '';
                existingImageUrl.value = '';
                currentImagePreview.classList.add('hidden');
                document.getElementById('iconPreview').className = 'fas fa-chart-line text-slate-400 text-lg';
            }
            appModal.classList.remove('opacity-0', 'pointer-events-none');
            appModalContent.classList.remove('scale-95');
        }

        function closeAppModal() {
            appModal.classList.add('opacity-0', 'pointer-events-none');
            appModalContent.classList.add('scale-95');
        }

        document.getElementById('closeAppModalBtn').addEventListener('click', closeAppModal);
        document.getElementById('cancelAppBtn').addEventListener('click', closeAppModal);
        
        document.getElementById('removeImageBtn').addEventListener('click', () => {
            document.getElementById('existingImageUrl').value = '';
            document.getElementById('currentImagePreview').classList.add('hidden');
        });

        document.getElementById('appIcon').addEventListener('input', (e) => {
            document.getElementById('iconPreview').className = e.target.value || 'fas fa-chart-line text-slate-400 text-lg';
        });

        appFormDom.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = e.target.querySelector('button[type="submit"]');
            const originalBtnText = submitBtn.innerText;
            submitBtn.innerText = "Gemmer...";
            submitBtn.disabled = true;

            try {
                const id = document.getElementById('appId').value;
                const title = document.getElementById('appName').value.trim();
                const description = document.getElementById('appDescription').value.trim();
                const url = document.getElementById('appUrl').value.trim();
                const icon = document.getElementById('appIcon').value.trim() || 'fas fa-chart-line';
                
                let imageUrl = document.getElementById('existingImageUrl').value;
                const fileInput = document.getElementById('appImageFile');

                if (fileInput.files.length > 0) {
                    const file = fileInput.files[0];
                    const fileRef = ref(storage, `users/${currentUser.uid}/app_images/${Date.now()}_${file.name}`);
                    const snapshot = await uploadBytes(fileRef, file);
                    imageUrl = await getDownloadURL(snapshot.ref);
                }

                if (id) {
                    const index = apps.findIndex(a => a.id === id);
                    if (index !== -1) apps[index] = { id, title, description, url, icon, imageUrl };
                } else {
                    apps.push({ id: Date.now().toString(), title, description, url, icon, imageUrl });
                }

                await saveAppsToFirestore();
                closeAppModal();
            } catch (error) {
                console.error("Fejl ved gemning:", error);
                alert("Der opstod en fejl. Tjek venligst din forbindelse.");
            } finally {
                submitBtn.innerText = originalBtnText;
                submitBtn.disabled = false;
            }
        });

        window.deleteApp = (id) => {
            apps = apps.filter(app => app.id !== id);
            saveAppsToFirestore();
        }

        const mobileTodoBtn = document.getElementById('mobileTodoBtn');
        const closeSidebarBtn = document.getElementById('closeSidebarBtn');
        const todoSidebar = document.getElementById('todoSidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');

        function toggleMobileSidebar() {
            const isClosed = todoSidebar.classList.contains('translate-x-full');
            if (isClosed) {
                todoSidebar.classList.remove('translate-x-full');
                sidebarOverlay.classList.remove('opacity-0', 'pointer-events-none');
            } else {
                todoSidebar.classList.add('translate-x-full');
                sidebarOverlay.classList.add('opacity-0', 'pointer-events-none');
            }
        }

        mobileTodoBtn.addEventListener('click', toggleMobileSidebar);
        closeSidebarBtn.addEventListener('click', toggleMobileSidebar);
        sidebarOverlay.addEventListener('click', toggleMobileSidebar);

        // Desktop Resizer
        const resizer = document.getElementById('sidebarResizer');
        let isResizing = false;

        resizer.addEventListener('mousedown', () => {
            isResizing = true;
            document.body.style.cursor = 'col-resize';
            document.body.style.userSelect = 'none';
        });

        document.addEventListener('mousemove', (e) => {
            if (!isResizing || window.innerWidth < 1024) return;
            let newWidth = window.innerWidth - e.clientX;
            if (newWidth < 280) newWidth = 280;
            if (newWidth > window.innerWidth / 2) newWidth = window.innerWidth / 2;
            todoSidebar.style.width = `${newWidth}px`;
        });

        document.addEventListener('mouseup', () => {
            if (isResizing) {
                isResizing = false;
                document.body.style.cursor = 'default';
                document.body.style.userSelect = 'auto';
            }
        });

        // Toggle Edit Mode
        const toggleEditBtn = document.getElementById('toggleEditBtn');
        const addAppBtnHeader = document.getElementById('addAppBtnHeader');
        
        toggleEditBtn.addEventListener('click', () => {
            isEditMode = !isEditMode;
            if (isEditMode) {
                toggleEditBtn.classList.replace('bg-slate-50', 'bg-blue-100');
                toggleEditBtn.classList.replace('text-slate-700', 'text-blue-700');
                toggleEditBtn.classList.replace('border-slate-200', 'border-blue-200');
                toggleEditBtn.innerHTML = '<i class="fas fa-check"></i> <span class="hidden sm:inline">Færdig</span>';
                addAppBtnHeader.classList.remove('hidden');
            } else {
                toggleEditBtn.classList.replace('bg-blue-100', 'bg-slate-50');
                toggleEditBtn.classList.replace('text-blue-700', 'text-slate-700');
                toggleEditBtn.classList.replace('border-blue-200', 'border-slate-200');
                toggleEditBtn.innerHTML = '<i class="fas fa-pen"></i> <span class="hidden sm:inline">Rediger</span>';
                addAppBtnHeader.classList.add('hidden');
            }
            renderApps();
        });
        
        addAppBtnHeader.addEventListener('click', () => openAppModal());

    </script>
</body>
</html>
