<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My GitHub Apps Dashboard</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
        }
        .app-card {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .app-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
        }
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        
        /* Loading Spinner */
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #1e293b;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="min-h-screen antialiased flex flex-col items-center py-12 px-6 relative">

    <!-- INITIAL LOADING SCREEN -->
    <div id="loadingScreen" class="fixed inset-0 bg-slate-50 z-50 flex flex-col items-center justify-center transition-opacity duration-300">
        <div class="loader mb-4"></div>
        <p class="text-slate-500 font-medium text-sm">Tilslutter til Firebase...</p>
    </div>

    <!-- AUTHENTICATION VIEW -->
    <div id="authView" class="w-full max-w-md hidden flex-col justify-center mt-10">
        <div class="bg-white p-8 rounded-2xl shadow-xl border border-slate-100">
            <div class="text-center mb-8">
                <div class="w-12 h-12 bg-slate-800 rounded-xl mx-auto flex items-center justify-center mb-4">
                    <i class="fas fa-lock text-white text-xl"></i>
                </div>
                <h1 class="text-2xl font-semibold tracking-tight text-slate-800" id="authTitle">Log Ind</h1>
                <p class="text-sm text-slate-500 mt-2" id="authSubtitle">Få adgang til dit synkroniserede dashboard</p>
            </div>

            <form id="authForm" class="space-y-4">
                <div id="authErrorMsg" class="hidden bg-red-50 text-red-600 text-sm p-3 rounded-lg border border-red-100 text-center"></div>
                
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1.5">Email</label>
                    <input type="email" id="authEmail" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-slate-800/20 focus:border-slate-800 outline-none transition-all text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1.5">Adgangskode</label>
                    <input type="password" id="authPassword" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-slate-800/20 focus:border-slate-800 outline-none transition-all text-sm">
                </div>
                <button type="submit" id="authSubmitBtn" class="w-full py-3 rounded-xl bg-slate-800 text-white font-medium hover:bg-slate-700 transition-colors shadow-sm mt-2 flex justify-center items-center gap-2">
                    <span>Log ind</span>
                </button>
            </form>
            
            <div class="mt-6 text-center">
                <button type="button" id="toggleAuthModeBtn" class="text-sm text-slate-500 hover:text-slate-800 transition-colors">
                    Har du ikke en konto? Opret en her.
                </button>
            </div>
        </div>
    </div>

    <!-- DASHBOARD VIEW -->
    <div id="dashboardView" class="w-full max-w-5xl hidden flex-col">
        <!-- Header -->
        <div class="flex flex-col md:flex-row md:justify-between md:items-center mb-12 gap-4">
            <div>
                <h1 class="text-3xl font-semibold tracking-tight text-slate-800">My Apps</h1>
                <p class="text-sm text-slate-500 mt-1 font-light flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span> Synkroniseret via Firebase
                </p>
            </div>
            
            <div class="flex gap-3 flex-wrap">
                <button id="addAppBtnHeader" class="px-5 py-2.5 rounded-xl bg-slate-800 text-white font-medium text-sm hover:bg-slate-700 transition-colors shadow-sm flex items-center gap-2 hidden">
                    <i class="fas fa-plus text-xs"></i> <span>Add App</span>
                </button>
                <button id="toggleEditBtn" class="px-5 py-2.5 rounded-xl bg-white border border-slate-200 text-slate-600 font-medium text-sm hover:bg-slate-50 transition-colors shadow-sm flex items-center gap-2">
                    <i class="fas fa-pen text-xs"></i> <span>Edit Mode</span>
                </button>
                <button id="logoutBtn" class="px-4 py-2.5 rounded-xl bg-slate-100 text-slate-600 font-medium text-sm hover:bg-slate-200 transition-colors shadow-sm flex items-center gap-2" title="Log ud">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </div>

        <!-- App Grid -->
        <div id="appGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Dynamisk indhold -->
        </div>
    </div>

    <!-- ADD/EDIT APP MODAL -->
    <div id="appModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300 flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl w-full max-w-md shadow-2xl overflow-hidden transform scale-95 transition-transform duration-300" id="modalContent">
            <div class="px-6 py-5 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                <h3 class="text-lg font-semibold text-slate-800" id="modalTitle">Add New App</h3>
                <button id="closeModalBtn" class="text-slate-400 hover:text-slate-600 transition-colors">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <form id="appForm" class="p-6">
                <input type="hidden" id="appId">
                <div class="mb-5">
                    <label class="block text-sm font-medium text-slate-700 mb-1.5">App Title</label>
                    <input type="text" id="appName" required placeholder="e.g., Budget Tracker" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-slate-800/20 focus:border-slate-800 outline-none transition-all text-sm">
                </div>
                <div class="mb-5">
                    <label class="block text-sm font-medium text-slate-700 mb-1.5">URL</label>
                    <input type="text" id="appUrl" required placeholder="/my-app-folder/ eller https://..." class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-slate-800/20 focus:border-slate-800 outline-none transition-all text-sm">
                </div>
                <div class="mb-6">
                    <label class="block text-sm font-medium text-slate-700 mb-1.5 flex justify-between">
                        <span>FontAwesome Icon Class</span>
                        <a href="https://fontawesome.com/search?o=r&m=free" target="_blank" class="text-slate-400 hover:text-slate-800 text-xs flex items-center gap-1">
                            Find ikoner <i class="fas fa-external-link-alt text-[10px]"></i>
                        </a>
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i id="iconPreview" class="fas fa-box text-slate-400"></i>
                        </div>
                        <input type="text" id="appIcon" required placeholder="fas fa-calculator" class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-slate-800/20 focus:border-slate-800 outline-none transition-all text-sm">
                    </div>
                </div>
                <div class="flex justify-end gap-3 pt-2">
                    <button type="button" id="cancelBtn" class="px-5 py-2.5 rounded-xl bg-white border border-slate-200 text-slate-600 font-medium text-sm hover:bg-slate-50 transition-colors">Cancel</button>
                    <button type="submit" class="px-5 py-2.5 rounded-xl bg-slate-800 text-white font-medium text-sm hover:bg-slate-700 transition-colors shadow-sm">Save App</button>
                </div>
            </form>
        </div>
    </div>

    <!-- FIREBASE MODULE SCRIPT -->
    <script type="module">
        // Import Firebase v10 Modular SDKs
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { 
            getAuth, 
            onAuthStateChanged, 
            signInWithEmailAndPassword, 
            createUserWithEmailAndPassword, 
            signOut 
        } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { 
            getFirestore, 
            doc, 
            setDoc, 
            onSnapshot 
        } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // Dit specifikke Firebase konfiguration (direkte fra screenshot)
        const firebaseConfig = {
            apiKey: "AIzaSyAuXoKwdJw4t0Z7AcFxD9sgB1obLXwvuhE",
            authDomain: "planteorg.firebaseapp.com",
            projectId: "planteorg",
            storageBucket: "planteorg.firebasestorage.app",
            messagingSenderId: "541919073169",
            appId: "1:541919073169:web:0ce8328fad7fa58d654030",
            measurementId: "G-G7PEWNP7BH"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // State Variables
        let apps = [];
        let isEditMode = false;
        let currentUser = null;
        let firestoreUnsubscribe = null;
        let isLoginMode = true; // true = login, false = register

        // Standard apps hvis databasen er tom
        const defaultApps = [
            { id: '1', title: 'Calculator', url: '#', icon: 'fas fa-calculator' },
            { id: '2', title: 'Weather', url: '#', icon: 'fas fa-cloud-sun' },
            { id: '3', title: 'Tasks', url: '#', icon: 'fas fa-check-square' }
        ];

        // --- DOM Elements ---
        const loadingScreen = document.getElementById('loadingScreen');
        const authView = document.getElementById('authView');
        const dashboardView = document.getElementById('dashboardView');
        
        // Auth UI
        const authForm = document.getElementById('authForm');
        const authTitle = document.getElementById('authTitle');
        const authSubtitle = document.getElementById('authSubtitle');
        const authSubmitBtn = document.getElementById('authSubmitBtn');
        const toggleAuthModeBtn = document.getElementById('toggleAuthModeBtn');
        const authErrorMsg = document.getElementById('authErrorMsg');
        const logoutBtn = document.getElementById('logoutBtn');

        // Dashboard UI
        const appGrid = document.getElementById('appGrid');
        const toggleEditBtn = document.getElementById('toggleEditBtn');
        const addAppBtnHeader = document.getElementById('addAppBtnHeader');
        
        // Modal UI
        const modal = document.getElementById('appModal');
        const modalContent = document.getElementById('modalContent');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        const appFormDom = document.getElementById('appForm');


        // --- AUTHENTICATION LOGIC ---
        
        // Lyt efter ændringer i login-status (husk mig-funktionalitet)
        onAuthStateChanged(auth, (user) => {
            loadingScreen.classList.add('opacity-0', 'pointer-events-none');
            setTimeout(() => loadingScreen.style.display = 'none', 300);

            if (user) {
                // Bruger er logget ind
                currentUser = user;
                authView.classList.add('hidden');
                dashboardView.classList.remove('hidden');
                dashboardView.classList.add('flex');
                
                // Start live-synkronisering af apps
                startSync(user.uid);
            } else {
                // Ingen bruger
                currentUser = null;
                authView.classList.remove('hidden');
                authView.classList.add('flex');
                dashboardView.classList.add('hidden');
                dashboardView.classList.remove('flex');
                
                if (firestoreUnsubscribe) firestoreUnsubscribe();
            }
        });

        // Håndter Login / Opret bruger form
        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            authErrorMsg.classList.add('hidden');
            const email = document.getElementById('authEmail').value;
            const password = document.getElementById('authPassword').value;
            
            const btnSpan = authSubmitBtn.querySelector('span');
            const originalText = btnSpan.innerText;
            btnSpan.innerText = "Vent venligst...";
            authSubmitBtn.disabled = true;

            try {
                if (isLoginMode) {
                    await signInWithEmailAndPassword(auth, email, password);
                } else {
                    await createUserWithEmailAndPassword(auth, email, password);
                }
                // onAuthStateChanged håndterer UI skiftet
            } catch (error) {
                let msg = "Der opstod en fejl.";
                if (error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password') msg = "Forkert email eller adgangskode.";
                if (error.code === 'auth/email-already-in-use') msg = "Email er allerede i brug.";
                if (error.code === 'auth/weak-password') msg = "Adgangskoden skal være på mindst 6 tegn.";
                
                authErrorMsg.innerText = msg;
                authErrorMsg.classList.remove('hidden');
            } finally {
                btnSpan.innerText = originalText;
                authSubmitBtn.disabled = false;
            }
        });

        // Skift mellem Login og Opret Konto UI
        toggleAuthModeBtn.addEventListener('click', () => {
            isLoginMode = !isLoginMode;
            authErrorMsg.classList.add('hidden');
            if (isLoginMode) {
                authTitle.innerText = "Log Ind";
                authSubtitle.innerText = "Få adgang til dit synkroniserede dashboard";
                authSubmitBtn.querySelector('span').innerText = "Log ind";
                toggleAuthModeBtn.innerText = "Har du ikke en konto? Opret en her.";
            } else {
                authTitle.innerText = "Opret Konto";
                authSubtitle.innerText = "Opret dit personlige dashboard";
                authSubmitBtn.querySelector('span').innerText = "Opret bruger";
                toggleAuthModeBtn.innerText = "Har du allerede en konto? Log ind.";
            }
        });

        // Log Ud
        logoutBtn.addEventListener('click', () => {
            signOut(auth);
        });


        // --- FIRESTORE SYNC LOGIC ---

        function startSync(uid) {
            const userDocRef = doc(db, 'users', uid);
            
            // onSnapshot lytter live! Ændres databasen fra en anden enhed, opdateres UI'et her øjeblikkeligt.
            firestoreUnsubscribe = onSnapshot(userDocRef, (docSnap) => {
                if (docSnap.exists()) {
                    apps = docSnap.data().apps || [];
                } else {
                    // Første gang brugeren logger ind, opretter vi dokumentet med standard apps
                    apps = [...defaultApps];
                    saveAppsToFirestore(); 
                }
                renderApps();
            }, (error) => {
                console.error("Fejl ved synkronisering:", error);
                alert("Kunne ikke synkronisere data. Tjek dine Firestore sikkerhedsregler.");
            });
        }

        async function saveAppsToFirestore() {
            if (!currentUser) return;
            const userDocRef = doc(db, 'users', currentUser.uid);
            try {
                // Skubber det opdaterede array op i skyen. onSnapshot sørger derefter for at gen-rendre UI'et
                await setDoc(userDocRef, { apps: apps }, { merge: true });
            } catch (error) {
                console.error("Fejl ved gem:", error);
            }
        }


        // --- DASHBOARD UI LOGIC ---

        function renderApps() {
            appGrid.innerHTML = '';
            
            apps.forEach(app => {
                const card = document.createElement('div');
                card.className = `app-card relative bg-white rounded-2xl border border-slate-100 flex flex-col items-center justify-center p-6 text-center ${isEditMode ? 'cursor-default' : 'cursor-pointer'}`;
                
                if (!isEditMode) {
                    card.onclick = () => window.open(app.url, '_blank');
                }

                card.innerHTML = `
                    <div class="w-16 h-16 rounded-2xl bg-slate-50 flex items-center justify-center mb-4 text-slate-600 text-2xl group-hover:scale-110 transition-transform duration-300">
                        <i class="${app.icon}"></i>
                    </div>
                    <h3 class="text-sm font-medium text-slate-800">${app.title}</h3>
                `;

                if (isEditMode) {
                    const controls = document.createElement('div');
                    controls.className = 'absolute top-3 right-3 flex gap-2';
                    
                    const editBtn = document.createElement('button');
                    editBtn.className = 'w-8 h-8 rounded-full bg-slate-100 text-slate-600 hover:bg-slate-200 flex items-center justify-center transition-colors';
                    editBtn.innerHTML = '<i class="fas fa-pen text-[10px]"></i>';
                    editBtn.onclick = (e) => { e.stopPropagation(); openModal(app); };
                    
                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'w-8 h-8 rounded-full bg-red-50 text-red-500 hover:bg-red-100 flex items-center justify-center transition-colors';
                    deleteBtn.innerHTML = '<i class="fas fa-trash text-[10px]"></i>';
                    deleteBtn.onclick = (e) => { e.stopPropagation(); deleteApp(app.id); };

                    controls.appendChild(editBtn);
                    controls.appendChild(deleteBtn);
                    card.appendChild(controls);
                    card.classList.add('opacity-90');
                }

                appGrid.appendChild(card);
            });

            if (isEditMode) {
                const addCard = document.createElement('div');
                addCard.className = 'app-card relative rounded-2xl border-2 border-dashed border-slate-200 bg-transparent hover:border-slate-300 hover:bg-slate-50 flex flex-col items-center justify-center p-6 text-center cursor-pointer transition-colors';
                addCard.onclick = () => openModal();
                addCard.innerHTML = `
                    <div class="w-12 h-12 rounded-full bg-slate-100 flex items-center justify-center mb-3 text-slate-500">
                        <i class="fas fa-plus"></i>
                    </div>
                    <h3 class="text-sm font-medium text-slate-600">Add App</h3>
                `;
                appGrid.appendChild(addCard);
            }
        }

        // Edit Mode Toggle
        toggleEditBtn.addEventListener('click', () => {
            isEditMode = !isEditMode;
            if (isEditMode) {
                toggleEditBtn.classList.add('bg-slate-800', 'text-white');
                toggleEditBtn.classList.remove('bg-white', 'text-slate-600');
                toggleEditBtn.innerHTML = '<i class="fas fa-check text-xs"></i> <span>Done Editing</span>';
                addAppBtnHeader.classList.remove('hidden');
            } else {
                toggleEditBtn.classList.remove('bg-slate-800', 'text-white');
                toggleEditBtn.classList.add('bg-white', 'text-slate-600');
                toggleEditBtn.innerHTML = '<i class="fas fa-pen text-xs"></i> <span>Edit Mode</span>';
                addAppBtnHeader.classList.add('hidden');
            }
            renderApps();
        });

        addAppBtnHeader.addEventListener('click', () => openModal());
        closeModalBtn.addEventListener('click', closeModal);
        cancelBtn.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

        const appIdInput = document.getElementById('appId');
        const appNameInput = document.getElementById('appName');
        const appUrlInput = document.getElementById('appUrl');
        const appIconInput = document.getElementById('appIcon');
        const iconPreview = document.getElementById('iconPreview');

        appIconInput.addEventListener('input', (e) => {
            const iconClass = e.target.value.trim();
            iconPreview.className = iconClass ? iconClass : 'fas fa-box text-slate-300';
        });

        function openModal(app = null) {
            if (app) {
                document.getElementById('modalTitle').textContent = 'Edit App';
                appIdInput.value = app.id;
                appNameInput.value = app.title;
                appUrlInput.value = app.url;
                appIconInput.value = app.icon;
                iconPreview.className = app.icon;
            } else {
                document.getElementById('modalTitle').textContent = 'Add New App';
                appFormDom.reset();
                appIdInput.value = '';
                iconPreview.className = 'fas fa-box text-slate-300';
            }
            modal.classList.remove('opacity-0', 'pointer-events-none');
            modalContent.classList.remove('scale-95');
            modalContent.classList.add('scale-100');
            setTimeout(() => appNameInput.focus(), 100);
        }

        function closeModal() {
            modal.classList.add('opacity-0', 'pointer-events-none');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');
        }

        appFormDom.addEventListener('submit', (e) => {
            e.preventDefault();
            const id = appIdInput.value;
            const title = appNameInput.value.trim();
            const url = appUrlInput.value.trim();
            const icon = appIconInput.value.trim() || 'fas fa-link';

            if (id) {
                const index = apps.findIndex(a => a.id === id);
                if (index !== -1) apps[index] = { id, title, url, icon };
            } else {
                apps.push({ id: Date.now().toString(), title, url, icon });
            }

            saveAppsToFirestore(); // Gemmer til database og lader onSnapshot gen-tegne UI'et
            closeModal();
        });

        function deleteApp(id) {
            const confirmBox = document.createElement('div');
            confirmBox.className = 'fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-sm p-4';
            confirmBox.innerHTML = `
                <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl text-center transform scale-100">
                    <div class="w-12 h-12 rounded-full bg-red-100 text-red-500 mx-auto flex items-center justify-center text-xl mb-4">
                        <i class="fas fa-exclamation-triangle"></i>
                    </div>
                    <h3 class="text-lg font-semibold text-slate-800 mb-2">Delete App?</h3>
                    <p class="text-slate-500 text-sm mb-6">Er du sikker på, du vil fjerne denne app?</p>
                    <div class="flex gap-3 justify-center">
                        <button id="cancelDelBtn" class="px-4 py-2 rounded-xl bg-slate-100 text-slate-700 font-medium text-sm hover:bg-slate-200 transition-colors flex-1">Annuller</button>
                        <button id="confirmDelBtn" class="px-4 py-2 rounded-xl bg-red-500 text-white font-medium text-sm hover:bg-red-600 transition-colors shadow-sm flex-1">Slet</button>
                    </div>
                </div>
            `;
            
            document.body.appendChild(confirmBox);
            
            document.getElementById('cancelDelBtn').onclick = () => confirmBox.remove();
            document.getElementById('confirmDelBtn').onclick = () => {
                apps = apps.filter(app => app.id !== id);
                saveAppsToFirestore();
                confirmBox.remove();
            };
        }
    </script>
</body>
</html>
